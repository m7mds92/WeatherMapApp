<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherMap App</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <h1>WeatherMap Application</h1>
    </header>
    <main class="app-main">
        <form id="weather-form" class="weather-form">
            <input type="text"
                placeholder="Search for a location"
                required
                autocomplete="off">
            <button type="submit" id="search-btn">GO!</button>
        </form>

        <div id="error-alert" class="error-alert hidden"></div>

        <div id="loading-spinner" class="spinner-container hidden">
            <div class="spinner"></div>
            <p>Fetching weather data</p>
        </div>

        <div id="map" class="map-container"></div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/map.js"></script>
</body>
</html>
